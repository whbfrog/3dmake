<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'XingShu'; src: url('fonts/ZhiMangXing-Regular.ttf'); }
  @font-face { font-family: 'Hand'; src: url('fonts/Caveat.ttf'); font-weight: 400 700; }
  html, body { margin: 0; padding: 0; background: #f5efe2; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0.07 0"/>
    </filter>
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.06" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.28  0 0 0 0.05 0"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#6b5a3e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6b5a3e" stop-opacity="0.22"/>
    </radialGradient>
    <filter id="ink"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="11" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="1.6"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="#f5efe2"/>
  <rect width="1920" height="1080" filter="url(#fibers)"/>
  <rect width="1920" height="1080" filter="url(#grain)"/>
  <g id="world" filter="url(#ink)"></g>
  <g id="pen"></g>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
  <rect id="fade" width="1920" height="1080" fill="#f5efe2" opacity="0"/>
</svg>
<script src="node_modules/roughjs/bundled/rough.js"></script>
<script src="scene.js"></script>
</body>
</html>
